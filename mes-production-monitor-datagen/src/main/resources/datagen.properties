# 造数配置。见文档 9.3 / 9.3.1
#
# mode: dim | backfill | streaming | anomaly
#   dim       只造维表（10 个库的 worksite / workcenter / part / user）
#   backfill  历史回填：造过去 N 天的订单与报工，建立对账基线；时间戳是历史的，实时链路会判定为迟到
#   streaming 持续实时：常驻进程按真实节奏写，是验证实时链路的唯一手段（跑起来别关）
#   anomaly   单独注入某类异常（由 anomaly.type 指定哪一种）
mode = dim

# ==================== MySQL ====================
# JDBC 连接模板，%s 会被替换成库名（如 mes_old_zh）。
#   serverTimezone=Asia/Shanghai 必须与 MesConstants.BIZ_ZONE(+8) 一致，否则 DATETIME 落库整体偏移（文档 12 坑 #5）
#   rewriteBatchedStatements=true 是批量写入提速的关键：不开的话 addBatch 仍是逐条发送，慢一个数量级
mysql.jdbc.url.template = jdbc:mysql://hadoop1:3306/%s?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
mysql.username = root
mysql.password = TMcode@0204
# 攒批写入条数：MysqlWriter 每攒够这么多行 executeBatch + commit 一次。造数瓶颈在 MySQL 写入，批量能把它从分钟级压到秒级
datagen.batch.size = 1000

# ==================== 规模（每库，参照文档 9.3） ====================
# 全局放大倍数：order / manual / barcode 三个 count 都会乘上它。
# 跑通后把 scale 调到 10 给简历加"规模感"（约 25 万条报工明细）。注意瓶颈在 MySQL 写入，不在 Flink
datagen.scale = 1

# 每个车间（worksite）下的产线数。总产线数 = 7 个车间 × 此值，即 workcenterid 取值范围 1..(7×N)。
# 报工的 lot.workcenterid 引用这个范围；改小会让"总装线倾斜"更集中（数据倾斜更明显）
datagen.workcenters.per.site = 8

# 物料（part）数量。partid 取 1..N，订单 productionorder.partid 与扫码 barcodeautomatic.modelencode 都引用它。
# modelencode = PN%06d，必须与 part.partcode 一一对应，否则对账时手动/扫码两个通道的物料口径对不上
datagen.part.count = 200

# 用户数量。userid 取 1..N，lot.createdbyid 引用它；username = {基地}_op{NNN}
datagen.user.count = 50

# 每库订单数（× scale）。productionorderid 取 1..N，lot / barcode 的 productionorderid 都引用这个范围
datagen.order.count = 300

# 每库手动报工（lot）条数（× scale）。同一订单会被随机命中多次 → 跨批次报工、达成率逐步爬升
datagen.manual.report.count = 2000

# 每旧库扫码（barcodeautomatic）条数（× scale）。仅旧 MES 有扫码通道（新 MES 只有 lot）
datagen.barcode.report.count = 3000

# 单个 LPN 产生多少条扫码记录。必须 > 1，否则造不出原报表按 LPN 分组 SUM(quantity)、MAX(scantime) 的特征，
# 也就体会不到流上的"聚合边界"问题（文档 6.2.2）
datagen.barcode.records.per.lpn = 5

# ==================== backfill ====================
# 历史回填天数：订单 createddate / 报工 createddate、scantime 都落在 [now-N 天, now] 窗口内。
# 这些是历史时间戳，实时链路会判定为迟到；backfill 的用途是建对账基线、验证 CDC 全量 snapshot
backfill.days = 7

# ==================== streaming ====================
# 每轮写入间隔（毫秒）。越小越"实时"，但 MySQL 写入压力越大
streaming.interval.ms = 1000

# 白班（08:30~17:30）每轮写入的 lot 条数
streaming.day.shift.batch = 20

# 晚班每轮写入的 lot 条数（约白班的 1/5，模拟真实节奏：晚班稀疏）
streaming.night.shift.batch = 4

# ==================== 异常注入（文档 9.3.1） ====================
# 建议一次只开一种，确认该类告警能被准确捕获后再开下一种。
# 可选：correction / line-idle / over-report / lag / out-of-order
anomaly.type = correction

# ---- 超报 -> OVER_REPORT ----
# 多少比例的订单被注入超报（injectOverReport 按 productionorderid 从小到大取前 N 个）
anomaly.over.report.order.ratio = 0.02
# 超报幅度：注入一条 finishedquantity = orderquantity × (1 + 此值) 的大 lot。
# 单这一条就足以让累计超过订单量。0.1 = 超 10%；必须 > 0，否则等于没超
anomaly.over.report.excess.ratio = 0.1

# ---- 断流 -> MISSING_REPORT + Timer 时间语义 ----
# 停写的产线数量（选总装线作为停写目标）
anomaly.idle.line.count = 2
# 停写时长（分钟）。必须大于 alert.idle.threshold.ms（默认 60 分钟）才会触发 MISSING_REPORT。
# 本地快速自测时把这里和 alert.idle.threshold.ms 都调小（如 3 / 2）
anomaly.idle.duration.minutes = 90

# ---- 滞后 -> LAG + 分级升级 ----
# 多少比例的订单被注入滞后（injectLag 把它们的 duedate 压缩到 createddate 后 2 小时，
# 计划进度立即到 100%，达成率还在低位 → LAG）
anomaly.lag.order.ratio = 0.05
# 落后幅度：把目标订单的达成率压到 ≈ 计划进度 × (1 - 此值)，再压缩交期让计划进度到 100%，
# 缺口 ≈ 此值 > alert.lag.threshold，稳定触发 LAG。0.4 = 落后 40%；须在 (0, 1) 之间
anomaly.lag.behind.ratio = 0.4

# ---- 乱序 -> watermark 容忍度 + 迟到 side output ----
# 多少比例的 lot 记录 createddate 被回拨
anomaly.out.of.order.ratio = 0.03
# 回拨范围（秒）：必须跨过 watermark.out.of.orderness.seconds（默认 60）。
# 小于 60 的验证"能正常等到"，大于 60 的验证"迟到走 side output 且被计数"，两种都要造
anomaly.out.of.order.min.seconds = 10
anomaly.out.of.order.max.seconds = 120

# ---- 报工修正 -> changelog 语义 + CK 去重 ----
# 多少比例的 lot 被 UPDATE 修正（injectCorrection 用 lotid % N = 0 选中）
anomaly.correction.ratio = 0.03
# 修正幅度：finishedquantity = 原值 × (1 + 此值)。验证 CDC op=u + before 旧值 + CK 按 record_id 去重
anomaly.correction.magnitude = 0.2

# ---- 脏数据 -> 过滤口径 + dirty/dim_miss 计数（backfill/streaming 造数时直接烘焙进去） ----
# 多少比例的订单号以 FG 开头（原报表口径 NOT LIKE 'FG%' 要过滤掉）
anomaly.fg.order.ratio = 0.03
# 多少比例的报工量 finishedquantity <= 0（验证 DWD 的过滤口径）
anomaly.non.positive.qty.ratio = 0.02
# 多少比例的记录引用不存在的维表外键（worksiteid/partid 指向 9999/999999，验证 dim_miss_count）
anomaly.dangling.fk.ratio = 0.005
