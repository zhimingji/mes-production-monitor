# 作业1 CDC 采集配置
# 所有值都可用命令行覆盖：--key value

# ==================== 作业 ====================
job.parallelism = 2
checkpoint.interval.ms = 60000
# 本地 local mode 用 file://；YARN 集群必须换成 hdfs://（见文档 12 节坑 #7）
checkpoint.dir = file:///D:/program/github/mes-production-monitor/target/checkpoints/cdc

# ==================== MySQL 源 ====================
mysql.hostname = localhost
mysql.port = 3306
mysql.cdc.username = cdc
mysql.cdc.password = cdc123456

# ==================== CDC ====================
# 正则一次匹配 10 个库 / 5 个旧库（见文档 2.1）
cdc.lot.database.pattern = mes_(old|new)_.*
cdc.barcode.database.pattern = mes_old_.*

# server-id 区间必须互不重叠，且区间长度 >= 该 source 的并行度。
# 冲突时的报错是：A slave with the same server_uuid/server_id as this slave has connected to the master
cdc.lot.server.id = 5400-5409
cdc.barcode.server.id = 5410-5419

# initial = 全量 snapshot + 增量 binlog。开发期别用 latest-offset：
# 没有新数据写入时你会看到作业在跑但一条数据也没有，白排查半天。
cdc.startup.mode = initial

# 全量阶段分片大小。调大容易 OOM，调小会产生过多 split。
cdc.snapshot.chunk.size = 8096

# 必须与 MySQL 的 time_zone 一致，否则 DATETIME 偏移 8 小时
cdc.server.timezone = Asia/Shanghai

# ==================== Kafka Sink ====================
kafka.bootstrap.servers = localhost:9092
kafka.ods.topic = ods-mes-report
