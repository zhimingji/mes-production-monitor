# \u4F5C\u4E1A4 \u62A5\u5DE5\u5F02\u5E38\u544A\u8B66\u914D\u7F6E
#
# \u9608\u503C\u5168\u90E8\u914D\u7F6E\u5316\uFF1A\u9762\u8BD5\u88AB\u95EE"\u9608\u503C\u80FD\u6539\u5417"\uFF0C\u7B54"\u914D\u7F6E\u5316\u7684\uFF0C\u6539\u914D\u7F6E\u4E0D\u7528\u6539\u4EE3\u7801"\u624D\u4E13\u4E1A\u3002
# \u540E\u7EED\u53EF\u4EE5\u8FDB\u4E00\u6B65\u505A\u6210\u89C4\u5219\u8868\uFF08MySQL \u4E00\u5F20 alert_rule \u8868 + CDC \u5E7F\u64AD\uFF09\uFF0C\u8FDE\u91CD\u542F\u90FD\u4E0D\u9700\u8981\u3002

# ==================== \u4F5C\u4E1A ====================
job.parallelism = 1
job.disable.generic.types = true
checkpoint.dir = file:///D:/program/github/mes-production-monitor/target/checkpoints/alert
checkpoint.interval.ms = 60000
# 一致性语义：exactly-once（默认）/ at-least-once
checkpoint.mode = exactly-once
checkpoint.timeout.ms = 300000
# \u544A\u8B66\u4F5C\u4E1A\u72B6\u6001\u6700\u5927\uFF0CRocksDB + \u589E\u91CF checkpoint \u662F\u5FC5\u987B\u7684\uFF08\u89C1\u6587\u6863 6.4.1\uFF09
state.backend.type = rocksdb
state.backend.incremental = true
restart.attempts = 3
restart.delay.ms = 10000

# ==================== Kafka ====================
kafka.bootstrap.servers = localhost:9092
kafka.dwd.topic = dwd-mes-report
kafka.alert.topic = mes-alert
kafka.group.id = mes-production-monitor-alert
watermark.out.of.orderness.seconds = 60
watermark.idleness.seconds = 60

# ==================== \u544A\u8B66\u9608\u503C\uFF08\u6587\u6863 7.4\uFF09 ====================
# \u8D85\u62A5\uFF1A\u7D2F\u8BA1\u62A5\u5DE5\u91CF / \u8BA2\u5355\u91CF \u8D85\u8FC7\u8BE5\u6BD4\u4F8B\u30021.0 = \u8D85\u4E00\u4E2A\u5C31\u62A5\uFF1B1.05 = \u5141\u8BB8 5% \u8D85\u62A5
alert.over.report.ratio = 1.0
# \u6EDE\u540E\uFF1A\u8FBE\u6210\u7387\u843D\u540E\u8BA1\u5212\u8FDB\u5EA6\u8D85\u8FC7\u8BE5\u6BD4\u4F8B
alert.lag.threshold = 0.2
# \u6F0F\u62A5\uFF1A\u4EA7\u7EBF\u8FDE\u7EED\u65E0\u62A5\u5DE5\u65F6\u957F\uFF08\u6BEB\u79D2\uFF09\uFF0C\u9ED8\u8BA4 60 \u5206\u949F
alert.idle.threshold.ms = 3600000
# \u5206\u7EA7\u5347\u7EA7\u95F4\u9694\uFF08\u6BEB\u79D2\uFF09\uFF0C\u9ED8\u8BA4 10 \u5206\u949F\uFF1AP3 -> P2 -> P1
alert.escalate.interval.ms = 600000

# ==================== \u72B6\u6001 ====================
state.ttl.days = 7

# ==================== \u9489\u9489 ====================
# \u9ED8\u8BA4\u5173\u95ED\uFF0C\u672C\u5730\u8C03\u8BD5\u4E0D\u9700\u8981\u771F\u7684\u53D1\u6D88\u606F
alert.dingtalk.enabled = false
alert.dingtalk.webhook =
# \u9489\u9489\u673A\u5668\u4EBA\u786C\u9650 20 \u6761/\u5206\u949F\uFF0C\u7559\u70B9\u4F59\u91CF\u8BBE 18\u3002\u8D85\u9650\u4F1A\u6574\u6279\u5931\u8D25\uFF0C\u6240\u4EE5\u9650\u6D41\u662F\u5FC5\u987B\u7684
alert.dingtalk.max.per.minute = 18

# ==================== ClickHouse ====================
clickhouse.jdbc.url = jdbc:ch://localhost:8123/mes_production_monitor
clickhouse.username = mes_monitor
clickhouse.password = mesMonitor123456
# \u544A\u8B66\u91CF\u8FDC\u5C0F\u4E8E\u660E\u7EC6\uFF0C\u6512\u6279\u9608\u503C\u8981\u5C0F\uFF0C\u5426\u5219\u544A\u8B66\u4F1A\u88AB\u538B\u5728\u7F13\u51B2\u533A\u91CC\u51FA\u4E0D\u6765
clickhouse.batch.size = 100
clickhouse.flush.interval.ms = 2000
