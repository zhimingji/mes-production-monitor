# 作业3 DWS 指标聚合配置

# ==================== 作业 ====================
job.parallelism = 4
job.disable.generic.types = true
checkpoint.dir = file:///D:/program/github/mes-production-monitor/target/checkpoints/dws
checkpoint.interval.ms = 60000
checkpoint.min.pause.ms = 30000
checkpoint.timeout.ms = 300000
# 订单累计是有状态聚合，用 RocksDB + 增量 checkpoint
state.backend.type = rocksdb
state.backend.incremental = true
restart.attempts = 3
restart.delay.ms = 10000

# ==================== Kafka ====================
kafka.bootstrap.servers = localhost:9092
kafka.dwd.topic = dwd-mes-report
kafka.group.id = mes-production-monitor-dws
watermark.out.of.orderness.seconds = 60
watermark.idleness.seconds = 60
# 窗口允许迟到时长（分钟）。超过后走 side output 补数
window.allowed.lateness.minutes = 2

# ==================== 聚合 ====================
# 分钟窗口大小（分钟）
metric.window.minutes = 1
# 订单快照输出间隔（毫秒）。每来一笔报工就输出会把 ClickHouse 写爆
order.snapshot.emit.interval.ms = 10000
# 两阶段聚合的加盐基数。先设 1（不加盐）跑一版，观察到真实倾斜后再调大
# 建议值 = 并行度 × 2~4
agg.salt.buckets = 1

# ==================== 状态 ====================
# 订单状态兜底 TTL（天）。业务层的主动清理才是主力，这只是兜底（见文档 6.4.1）
state.ttl.days = 7

# ==================== ClickHouse ====================
clickhouse.jdbc.url = jdbc:ch://localhost:8123/mes_production_monitor
clickhouse.username = mes_monitor
clickhouse.password = mesMonitor123456
clickhouse.batch.size = 2000
clickhouse.flush.interval.ms = 5000
