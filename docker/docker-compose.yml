name: mes-production-monitor

# 本地开发环境：MySQL（10 库同实例）+ Kafka（KRaft 单节点）+ ClickHouse + Kafka UI
#
# Flink 作业跑在宿主机的 IDEA 里（local mode），不在 Docker 内，
# 因此所有 advertised 地址都必须是宿主机可达的 localhost。
#
# 启动：docker compose up -d
# 停止并清数据：docker compose down -v

services:

  # ==================================================================
  # MySQL：10 个 MES 库放在同一实例（见文档 2.1）
  # 一个 CDC source 用 database-name 正则即可匹配全部库，
  # 避免 10 个实例 = 10 个 binlog client 把本地机器打满。
  # ==================================================================
  mysql:
    image: mysql:8.0
    container_name: mes-production-monitor-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/binlog.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456" ]
      interval: 10s
      timeout: 5s
      retries: 20

  # ==================================================================
  # Kafka：KRaft 单节点（无 ZooKeeper）
  # ==================================================================
  kafka:
    image: apache/kafka:3.6.1
    container_name: mes-production-monitor-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      # 容器内其他服务用 kafka:19092；宿主机 IDEA 用 localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 显式关闭自动建 topic：让 topic 的分区数由 kafka-init 明确控制，
      # 避免"某个作业笔误写错 topic 名，Kafka 悄悄建了个单分区 topic"这类坑
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: mes-production-monitor-kraft-cluster-01
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 20

  # ==================================================================
  # 建 topic（一次性任务，建完退出）
  # 分区键按订单维度，保证同一订单进同一分区，便于有状态聚合与告警（见文档 5.1）
  # ==================================================================
  kafka-init:
    image: apache/kafka:3.6.1
    container_name: mes-production-monitor-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      set -e
      TOPICS='ods-mes-report:6 dwd-mes-report:6 mes-alert:3'
      for t in $$TOPICS; do
        name=$${t%%:*}
        parts=$${t##*:}
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --create --if-not-exists --topic $$name --partitions $$parts --replication-factor 1
        echo \"topic $$name (partitions=$$parts) ready\"
      done
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
      "
    restart: "no"

  # ==================================================================
  # ClickHouse
  # ==================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: mes-production-monitor-clickhouse
    ports:
      - "8123:8123"   # HTTP，JDBC 用这个
      - "9001:9000"   # Native（9000 让给宿主机其他服务，映射到 9001）
    environment:
      CLICKHOUSE_DB: mes_production_monitor
      CLICKHOUSE_USER: mes_monitor
      CLICKHOUSE_PASSWORD: mesMonitor123456
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: Asia/Shanghai
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20

  # ==================================================================
  # Kafka UI：直接看 topic 里的 debezium-json 长什么样，排查 changelog 语义时很有用
  # http://localhost:8080
  # ==================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mes-production-monitor-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: mes-production-monitor
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  mysql-data:
  kafka-data:
  clickhouse-data:
