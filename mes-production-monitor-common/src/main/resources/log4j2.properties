rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5p %-40.40c{1.} - %m%n

# 本项目日志
logger.mesProductionMonitor.name = com.mes.production.monitor
logger.mesProductionMonitor.level = INFO

# Flink 启动期日志太吵，调高一档
logger.flink.name = org.apache.flink
logger.flink.level = WARN

# 排查 CDC 问题时把下面两个改成 DEBUG：
# - snapshot 阶段 chunk 切分、binlog offset 推进都在这里
logger.cdc.name = org.apache.flink.cdc
logger.cdc.level = INFO
logger.debezium.name = io.debezium
logger.debezium.level = WARN

logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN
