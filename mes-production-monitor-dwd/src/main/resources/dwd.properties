# \u4F5C\u4E1A2 DWD \u660E\u7EC6\u5BBD\u8868\u914D\u7F6E

# ==================== \u4F5C\u4E1A ====================
job.parallelism = 4

# \u7C7B\u578B\u68C0\u67E5\uFF1ADimCache \u7684 Map \u5B57\u6BB5\u662F\u5408\u6CD5\u6CDB\u578B\uFF0C
# Flink TypeExtractor \u4E0D\u4E3A POJO \u7684 Map/List \u5B57\u6BB5\u751F\u6210 MapTypeInfo\uFF08FLINK-26470\uFF09\uFF0C
# \u56DE\u9000 Kryo \u5373\u53EF\uFF08\u5E7F\u64AD\u6001\u5C0F\uFF0C\u53EA\u5728\u5E7F\u64AD/checkpoint \u5E8F\u5217\u5316\uFF0C\u6027\u80FD\u65E0\u5F71\u54CD\uFF09\u3002
# \u70ED\u8DEF\u5F84 OdsReportRecord / DwdReportRecord \u4ECD\u662F\u5E72\u51C0 POJO\uFF0C\u4E0D\u8D70 Kryo\u3002
job.disable.generic.types = false

# ==================== \u4F5C\u4E1A ====================
state.backend.type = hashmap
state.backend.incremental = false

# ==================== checkpoint ====================
checkpoint.dir = hdfs://hadoop1:9000/checkpoint/dwd

# ==================== \u91CD\u542F\u7B56\u7565 ====================
restart.strategy = fixed-delay
restart.attempts = 6
restart.delay.ms = 10000

# ==================== Kafka ====================
kafka.bootstrap.servers = hadoop1:9092,hadoop2:9092,hadoop3:9092
kafka.ods.topic = ods-mes-report
kafka.ods.order.topic = ods-mes-order
kafka.ods.report.startup=earliest
# order dim CDC startup: earliest (idempotent upsert, safe replay) / latest
kafka.ods.order.startup = earliest
kafka.dwd.topic = dwd-mes-report

# ==================== Watermark ====================
# \u4E8B\u4EF6\u65F6\u95F4\u4E71\u5E8F\u5BB9\u5FCD\u5EA6\uFF08\u79D2\uFF09,\u8D85\u8FC7\u8FD9\u4E2A\u7684\u8D70 side output \u8865\u6570\uFF0C\u5E76\u8BA1\u5165 late_record_count
watermark.out.of.orderness.seconds = 60
# \u7A7A\u95F2\u5206\u533A\u8D85\u8FC7\u8FD9\u4E2A\u65F6\u957F\u540E\u4E0D\u518D\u963B\u585E\u5168\u5C40 watermark \u63A8\u8FDB
# \u6CE8\u610F\uFF1A\u8FD9\u53EA\u89E3\u51B3"\u90E8\u5206\u5206\u533A\u7A7A\u95F2"\uFF0C\u5168\u90E8\u5206\u533A\u90FD\u6CA1\u6570\u636E\u65F6 watermark \u4F9D\u7136\u4E0D\u52A8\uFF0C
# \u6240\u4EE5\u6F0F\u62A5\u68C0\u6D4B\u4ECD\u5FC5\u987B\u7528\u5904\u7406\u65F6\u95F4 Timer
watermark.idleness.seconds = 60

# ==================== MySQL \u7EF4\u8868 ====================
# %s \u4F1A\u88AB 10 \u4E2A\u5E93\u540D\u4F9D\u6B21\u66FF\u6362
mysql.jdbc.url.template = jdbc:mysql://hadoop1:3306/%s?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
mysql.username = root
mysql.password = TMcode@0204
# \u7EF4\u8868\u5168\u91CF\u5237\u65B0\u5468\u671F,\u53D8\u66F4\u5EF6\u8FDF\u6700\u957F\u5C31\u662F\u8FD9\u4E2A\u503C
dim.refresh.interval.ms = 300000
# part \u5927\u7EF4\u8868\u6309\u9700\u67E5\u8BE2\u7F13\u5B58\u4E0A\u9650\uFF08LRU \u6761\u6570\uFF09\u3002\u53EA\u7F13\u5B58\u88AB\u8BA2\u5355\u5F15\u7528\u5230\u7684\u7269\u6599\uFF0C
# \u51B7\u542F\u52A8 miss \u8D70 JDBC\uFF0C\u4E4B\u540E\u547D\u4E2D\u7F13\u5B58\uFF1B\u8D85\u8FC7\u4E0A\u9650\u9010\u51FA\u6700\u4E45\u672A\u7528\u7684\u6761\u76EE\u3002
part.cache.max.size = 50000

# ==================== ClickHouse ====================
clickhouse.jdbc.url = jdbc:clickhouse:http://hadoop1:8123/mes_production_monitor?compress=false
clickhouse.username = default
clickhouse.password = TMClickhouse0204
# \u6512\u6279\uFF1A\u6761\u6570 + \u65F6\u95F4\u53CC\u89E6\u53D1\u3002\u5355\u4E00\u6761\u4EF6\u90FD\u4E0D\u884C\uFF0C\u89C1\u6587\u6863 11.2
# \u53EA\u6309\u6761\u6570 -> \u4F4E\u5CF0\u671F\u6570\u636E\u957F\u65F6\u95F4\u4E0D\u843D\u5730\uFF1B\u53EA\u6309\u65F6\u95F4 -> \u9AD8\u5CF0\u671F\u6279\u6B21\u8FC7\u5927
clickhouse.batch.size = 5000
clickhouse.flush.interval.ms = 10000
