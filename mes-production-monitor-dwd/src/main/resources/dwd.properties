# 作业2 DWD 明细宽表配置

# ==================== 作业 ====================
job.parallelism = 4
job.disable.generic.types = true
checkpoint.dir = file:///D:/program/github/mes-production-monitor/target/checkpoints/dwd
checkpoint.interval.ms = 60000
# 一致性语义：exactly-once（默认）/ at-least-once
checkpoint.mode = exactly-once
checkpoint.timeout.ms = 300000
state.backend.type = hashmap
state.backend.incremental = false
restart.attempts = 3
restart.delay.ms = 10000

# ==================== Kafka ====================
kafka.bootstrap.servers = localhost:9092
kafka.ods.topic = ods-mes-report
kafka.dwd.topic = dwd-mes-report
kafka.group.id = mes-production-monitor-dwd
# 事件时间乱序容忍度（秒）。超过这个的走 side output 补数，并计入 late_record_count
watermark.out.of.orderness.seconds = 60
# 空闲分区超过这个时长后不再阻塞全局 watermark 推进。
# 注意：这只解决"部分分区空闲"，全部分区都没数据时 watermark 依然不动，
# 所以漏报检测仍必须用处理时间 Timer（见文档 6.4.2）
watermark.idleness.seconds = 60

# ==================== MySQL 维表 ====================
# %s 会被 10 个库名依次替换
mysql.jdbc.url.template = jdbc:mysql://localhost:3306/%s?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
mysql.username = mes_monitor
mysql.password = mesMonitor123456
# 维表全量刷新周期。变更延迟最长就是这个值，简历里如实说明
dim.refresh.interval.ms = 300000

# ==================== ClickHouse ====================
clickhouse.jdbc.url = jdbc:ch://localhost:8123/mes_production_monitor
clickhouse.username = mes_monitor
clickhouse.password = mesMonitor123456
# 攒批：条数 + 时间双触发。单一条件都不行，见文档 11.2
# 只按条数 -> 低峰期数据长时间不落地；只按时间 -> 高峰期批次过大
clickhouse.batch.size = 5000
clickhouse.flush.interval.ms = 10000
